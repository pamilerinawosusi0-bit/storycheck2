<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoryCheck | Personal Narrative Analyzer</title>
    <style>
        :root {
            --bg-color: #f4f7f9;
            --surface: #ffffff;
            --text-primary: #2d3436;
            --text-secondary: #636e72;
            --accent: #0984e3;
            --accent-light: #74b9ff;
            --success: #00b894;
            --warning: #fdcb6e;
            --danger: #d63031;
            --border: #dfe6e9;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
        }

        /* Layout */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Header */
        header {
            background: var(--surface);
            padding: 1rem 2rem;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo-icon {
            width: 24px;
            height: 24px;
            background: var(--accent);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
        }

        /* Hero / Input Section */
        .hero {
            text-align: center;
            margin: 3rem 0;
        }

        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .hero p {
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto 2rem;
        }

        .input-card {
            background: var(--surface);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
            max-width: 800px;
            margin: 0 auto;
        }

        .text-area-container {
            position: relative;
            margin-bottom: 1.5rem;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            resize: vertical;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(9, 132, 227, 0.1);
        }

        .char-count {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            background: var(--surface);
            padding: 0 5px;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-size: 1rem;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: #0878c2;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--bg-color);
        }

        /* Results Section */
        .results-section {
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        .results-section.active {
            display: block;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--surface);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }

        .report-card {
            background: var(--surface);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
        }

        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-success { background: #e6f7f0; color: var(--success); }
        .badge-warning { background: #fff8e1; color: #b45309; }
        .badge-danger { background: #ffebee; color: var(--danger); }

        .issue-list {
            list-style: none;
        }

        .issue-item {
            padding: 1rem;
            border-left: 4px solid var(--accent);
            background: #f8fafc;
            margin-bottom: 1rem;
            border-radius: 0 8px 8px 0;
        }

        .issue-item.warning { border-left-color: var(--warning); }
        .issue-item.danger { border-left-color: var(--danger); }

        .issue-title {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .issue-desc {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Loading State */
        .loader {
            display: none;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .hero h1 { font-size: 2rem; }
            .action-bar { flex-direction: column; gap: 1rem; }
            .action-bar .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <div class="logo-icon">S</div>
            StoryCheck
        </div>
        <nav>
            <button class="btn btn-secondary" onclick="resetApp()">New Check</button>
        </nav>
    </header>

    <div class="container">
        <!-- Input Area -->
        <div id="inputArea">
            <div class="hero">
                <h1>Verify Your Narrative</h1>
                <p>Paste your story, article, or bio below. Our engine will analyze consistency, tone, and factual logic to help you refine your message.</p>
            </div>

            <div class="input-card">
                <div class="text-area-container">
                    <textarea id="storyInput" placeholder="e.g., I was born in 1990 in New York. I graduated from Columbia University in 2012 with a degree in Computer Science. Currently, I work as a Senior Developer at a fintech startup. In my free time, I enjoy hiking and reading non-fiction. I believe that technology can solve most of the world's problems if applied correctly. My goal for the next five years is to launch my own SaaS product and give back to the community through mentorship."></textarea>
                    <span class="char-count" id="charCount">0 chars</span>
                </div>
                <div class="action-bar">
                    <button class="btn btn-secondary" onclick="loadExample()">Load Example</button>
                    <button class="btn btn-primary" onclick="runAnalysis()">Analyze Story</button>
                </div>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="loader">
            <div class="spinner"></div>
        </div>

        <!-- Results Area -->
        <div id="resultsArea" class="results-section">
            <div class="summary-grid">
                <div class="stat-card">
                    <div class="stat-value" id="statScore">--</div>
                    <div class="stat-label">Consistency Score</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statWords">--</div>
                    <div class="stat-label">Word Count</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statTone">--</div>
                    <div class="stat-label">Tone</div>
                </div>
            </div>

            <div class="report-card">
                <div class="report-header">
                    <h2>Detailed Analysis</h2>
                    <span id="overallBadge" class="badge badge-success">Verified</span>
                </div>
                
                <ul class="issue-list" id="issueList">
                    <!-- Issues populated by JS -->
                </ul>
            </div>

            <div style="text-align: center; margin-top: 2rem;">
                <button class="btn btn-primary" onclick="resetApp()">Check Another Story</button>
            </div>
        </div>
    </div>

    <script>
        const storyInput = document.getElementById('storyInput');
        const charCount = document.getElementById('charCount');
        const inputArea = document.getElementById('inputArea');
        const resultsArea = document.getElementById('resultsArea');
        const loadingState = document.getElementById('loadingState');

        // Update char count
        storyInput.addEventListener('input', () => {
            charCount.textContent = `${storyInput.value.length} chars`;
        });

        function loadExample() {
            storyInput.value = `I was born in 1990 in New York. I graduated from Columbia University in 2012 with a degree in Computer Science. Currently, I work as a Senior Developer at a fintech startup. In my free time, I enjoy hiking and reading non-fiction. I believe that technology can solve most of the world's problems if applied correctly. My goal for the next five years is to launch my own SaaS product and give back to the community through mentorship.`;
            charCount.textContent = `${storyInput.value.length} chars`;
        }

        function runAnalysis() {
            const text = storyInput.value.trim();
            
            if (text.length < 20) {
                alert("Please enter at least 20 characters for a meaningful analysis.");
                return;
            }

            // UI State: Loading
            inputArea.style.display = 'none';
            loadingState.style.display = 'flex';

            // Simulate API Delay
            setTimeout(() => {
                const analysis = generateAnalysis(text);
                displayResults(analysis);
                loadingState.style.display = 'none';
                resultsArea.classList.add('active');
            }, 1200);
        }

        function generateAnalysis(text) {
            const words = text.split(/\s+/).filter(w => w.length > 0);
            const wordCount = words.length;
            
            // Simple heuristic analysis
            const hasDates = /\b(19|20)\d{2}\b/.test(text);
            const hasPlaces = /\b(New York|London|Paris|Tokyo|Berlin)\b/i.test(text);
            const hasEducation = /\b(University|College|Graduated|Degree)\b/i.test(text);
            const hasProfessional = /\b(Work|Job|Company|Startup|Developer|Manager)\b/i.test(text);
            
            // Score Calculation (Simulated)
            let score = 50;
            if (hasDates) score += 10;
            if (hasPlaces) score += 10;
            if (hasEducation) score += 10;
            if (hasProfessional) score += 10;
            if (wordCount > 50) score += 10;
            
            // Cap at 98 to be realistic
            score = Math.min(98, score);

            // Tone Detection
            let tone = "Neutral";
            const positiveWords = ["love", "great", "amazing", "passion", "goal", "believe"];
            const negativeWords = ["hate", "bad", "problem", "fail", "struggle"];
            
            let posScore = 0, negScore = 0;
            words.forEach(w => {
                if (positiveWords.includes(w.toLowerCase())) posScore++;
                if (negativeWords.includes(w.toLowerCase())) negScore++;
            });

            if (posScore > negScore + 1) tone = "Positive";
            else if (negScore > posScore + 1) tone = "Serious";

            // Generate Issues/Suggestions
            const issues = [];

            if (!hasDates) {
                issues.push({
                    type: 'warning',
                    title: 'Missing Temporal Context',
                    desc: 'Consider adding specific years or timeframes to anchor key events in the narrative.'
                });
            }
            if (wordCount < 30) {
                issues.push({
                    type: 'warning',
                    title: 'Brief Narrative',
                    desc: 'The story is quite short. Adding more detail will improve credibility and engagement.'
                });
            }
            if (hasProfessional && !hasEducation) {
                issues.push({
                    type: 'info',
                    title: 'Background Gap',
                    desc: 'You mentioned professional experience. Adding educational background can provide context for your skills.'
                });
            }
            if (issues.length === 0) {
                issues.push({
                    type: 'success',
                    title: 'Strong Narrative Structure',
                    desc: 'Your story contains key elements: time, place, and professional context. It reads clearly and consistently.'
                });
            }

            return {
                score,
                wordCount,
                tone,
                issues
            };
        }

        function displayResults(data) {
            document.getElementById('statScore').textContent = data.score + '%';
            document.getElementById('statWords').textContent = data.wordCount;
            document.getElementById('statTone').textContent = data.tone;

            // Badge Logic
            const badge = document.getElementById('overallBadge');
            if (data.score >= 80) {
                badge.className = 'badge badge-success';
                badge.textContent = 'Verified';
            } else if (data.score >= 60) {
                badge.className = 'badge badge-warning';
                badge.textContent = 'Needs Review';
            } else {
                badge.className = 'badge badge-danger';
                badge.textContent = 'Inconsistent';
            }

            // Populate issues
            const issueList = document.getElementById('issueList');
            issueList.innerHTML = '';
            data.issues.forEach(issue => {
                const li = document.createElement('li');
                li.className = 'issue-item';
                if (issue.type === 'warning') li.classList.add('warning');
                if (issue.type === 'danger') li.classList.add('danger');

                li.innerHTML = `<div class="issue-title">${escapeHtml(issue.title)}</div><div class="issue-desc">${escapeHtml(issue.desc)}</div>`;
                issueList.appendChild(li);
            });
        }

        function resetApp() {
            // Reset UI to input state
            resultsArea.classList.remove('active');
            loadingState.style.display = 'none';
            inputArea.style.display = 'block';
            document.getElementById('issueList').innerHTML = '';
            document.getElementById('statScore').textContent = '--';
            document.getElementById('statWords').textContent = '--';
            document.getElementById('statTone').textContent = '--';
            document.getElementById('overallBadge').className = 'badge badge-success';
            document.getElementById('overallBadge').textContent = 'Verified';
        }

        // Simple escaping to avoid injection in generated HTML
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
    </script>
</body>
</html>
